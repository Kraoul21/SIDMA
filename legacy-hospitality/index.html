<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy Hospitality Group</title>
  <meta name="description" content="Legacy Hospitality Group — l'art de recevoir depuis 1967.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #F7F3EC;
      --cream: #EFE9DF;
      --grey-50: #E6E4E0;
      --grey-200: #CFCCC6;
      --grey-500: #8C8883;
      --ink: #2A2724;
      --bordeaux: #6E1F2A;
      --bordeaux-deep: #561721;
      --radius-pill: 999px;
      --radius-card: 28px;
      --serif: 'Cormorant Garamond', 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 50% 38%, #FBF8F3 0%, transparent 70%),
        linear-gradient(180deg, var(--ivory) 0%, var(--cream) 100%);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ---------- En-tête ---------- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px clamp(20px, 5vw, 64px);
    }

    .monogram {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: .12em;
      color: var(--bordeaux);
      text-decoration: none;
    }

    nav { display: flex; gap: 6px; }

    nav a {
      font-size: 12.5px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--grey-500);
      text-decoration: none;
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      transition: background .3s var(--ease), color .3s var(--ease);
    }

    nav a:hover { background: rgba(110, 31, 42, .06); color: var(--bordeaux); }

    /* ---------- Hero ---------- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px 80px;
    }

    .since {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 11.5px;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--bordeaux);
      margin-bottom: 28px;
    }

    .since::before, .since::after {
      content: '';
      width: 36px;
      height: 1px;
      background: var(--bordeaux);
      opacity: .45;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(44px, 8.5vw, 112px);
      line-height: .98;
      letter-spacing: -.01em;
      color: var(--ink);
    }

    h1 em {
      display: block;
      font-style: italic;
      font-size: .42em;
      letter-spacing: .28em;
      text-transform: uppercase;
      font-weight: 300;
      color: var(--grey-500);
      margin-top: 18px;
    }

    .tagline {
      margin-top: 26px;
      font-size: 15px;
      font-weight: 300;
      color: var(--grey-500);
      max-width: 420px;
      line-height: 1.7;
    }

    /* ---------- Encadré réservation ---------- */
    .booking {
      margin-top: 56px;
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, .55);
      border: 1px solid var(--grey-50);
      border-radius: var(--radius-card);
      padding: 30px clamp(20px, 4vw, 34px) 26px;
      backdrop-filter: blur(8px);
      box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 30px 60px -30px rgba(42, 39, 36, .18);
    }

    .booking label {
      display: block;
      font-size: 11.5px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--grey-500);
      margin-bottom: 16px;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--ivory);
      border: 1px solid var(--grey-200);
      border-radius: var(--radius-pill);
      padding: 6px;
      transition: border-color .3s var(--ease), box-shadow .3s var(--ease);
    }

    .field:focus-within {
      border-color: var(--bordeaux);
      box-shadow: 0 0 0 4px rgba(110, 31, 42, .08);
    }

    .field.invalid { border-color: var(--bordeaux); animation: shake .4s var(--ease); }

    .field input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-family: var(--sans);
      font-size: 16px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink);
      padding: 12px 8px 12px 20px;
    }

    .field input::placeholder { color: var(--grey-200); letter-spacing: .1em; }

    .field button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .08em;
      color: var(--ivory);
      background: var(--bordeaux);
      border-radius: var(--radius-pill);
      padding: 14px 24px;
      white-space: nowrap;
      transition: background .3s var(--ease), transform .3s var(--ease);
    }

    .field button:hover { background: var(--bordeaux-deep); }
    .field button:active { transform: scale(.97); }
    .field button svg { transition: transform .3s var(--ease); }
    .field button:hover svg { transform: translateX(3px); }
    .field button[disabled] { opacity: .7; cursor: default; }

    .hint {
      margin-top: 14px;
      min-height: 18px;
      font-size: 12.5px;
      color: var(--grey-500);
    }

    .hint.error { color: var(--bordeaux); }

    /* ---------- Pied de page ---------- */
    footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 24px clamp(20px, 5vw, 64px);
      font-size: 11.5px;
      letter-spacing: .08em;
      color: var(--grey-500);
      border-top: 1px solid var(--grey-50);
    }

    /* ---------- Animations ---------- */
    .reveal { opacity: 0; transform: translateY(14px); animation: reveal 1.1s var(--ease) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .75s; }

    @keyframes reveal { to { opacity: 1; transform: none; } }
    @keyframes shake {
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; opacity: 1; transform: none; }
    }

    @media (max-width: 560px) {
      nav { display: none; }
      .field { flex-direction: column; border-radius: 22px; padding: 8px; }
      .field input { width: 100%; text-align: center; padding: 14px 8px; }
      .field button { width: 100%; justify-content: center; }
      footer { justify-content: center; text-align: center; }
    }
  </style>
</head>
<body>

  <header class="reveal d1">
    <a href="#" class="monogram" aria-label="Legacy Hospitality Group">LHG</a>
    <nav aria-label="Navigation principale">
      <a href="#">Nos maisons</a>
      <a href="#">Héritage</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <span class="since reveal d1">Depuis 1967</span>

    <h1 class="reveal d2">
      Legacy
      <em>Hospitality Group</em>
    </h1>

    <p class="tagline reveal d3">L'art de recevoir, transmis de génération en génération.</p>

    <form class="booking reveal d4" id="booking-form" novalidate>
      <label for="booking-ref">Accéder à votre réservation</label>
      <div class="field" id="booking-field">
        <input
          id="booking-ref"
          name="ref"
          type="text"
          inputmode="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="N° de réservation"
          aria-describedby="booking-hint"
          maxlength="20"
          required>
        <button type="submit" id="booking-submit">
          Continuer
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <p class="hint" id="booking-hint" aria-live="polite">Figurant sur votre e-mail de confirmation.</p>
    </form>
  </main>

  <footer class="reveal d4">
    <span>© 1967 – <span id="year"></span> Legacy Hospitality Group</span>
    <span>Mentions légales · Confidentialité</span>
  </footer>

  <script>
    // Page vers laquelle le client sera redirigé une fois son numéro saisi.
    // Laisser à null tant que la page n'existe pas encore.
    const NEXT_PAGE = null; // ex. 'reservation.html'

    document.getElementById('year').textContent = new Date().getFullYear();

    const form = document.getElementById('booking-form');
    const field = document.getElementById('booking-field');
    const input = document.getElementById('booking-ref');
    const hint = document.getElementById('booking-hint');
    const submit = document.getElementById('booking-submit');
    const defaultHint = hint.textContent;

    input.addEventListener('input', () => {
      field.classList.remove('invalid');
      hint.classList.remove('error');
      hint.textContent = defaultHint;
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const ref = input.value.trim().toUpperCase();

      if (!/^[A-Z0-9-]{5,20}$/.test(ref)) {
        field.classList.remove('invalid');
        void field.offsetWidth; // relance l'animation
        field.classList.add('invalid');
        hint.classList.add('error');
        hint.textContent = 'Veuillez saisir un numéro de réservation valide.';
        input.focus();
        return;
      }

      try { sessionStorage.setItem('lhg_booking_ref', ref); } catch (_) {}

      submit.disabled = true;
      hint.textContent = 'Un instant…';

      if (NEXT_PAGE) {
        setTimeout(() => { window.location.href = NEXT_PAGE; }, 500);
      } else {
        setTimeout(() => {
          hint.textContent = `Réservation ${ref} enregistrée.`;
          submit.disabled = false;
        }, 500);
      }
    });
  </script>
</body>
</html>
